# ---------------------------------------------------------------------------
#  AI Voice Agent - Dashboard API
#
#  Ready to run locally as-is:
#      mvn spring-boot:run
#
#  Then open  http://localhost:8082/swagger-ui.html
#
#  Credentials come from .env (see .env.example) — they are not in this file
#  and not in the repository. Copy .env.example to .env and fill it in.
#
#  Every value below is a real, working local value. Change the ones marked
#  CHANGE BEFORE PRODUCTION before this runs anywhere other than a laptop.
# ---------------------------------------------------------------------------

spring:
  application:
    name: ai-voice-agent-dashboard

  data:
    mongodb:
      # Local MongoDB on the default port. The database is created on first write.
      uri: ${MONGODB_URI:mongodb://localhost:27017/vedryx_voice_agent}
      auto-index-creation: true
    web:
      pageable:
        default-page-size: 20
        max-page-size: 200

  jackson:
    # camelCase on the wire, matching the Java field names.
    serialization:
      write-dates-as-timestamps: false
      indent-output: true
    deserialization:
      fail-on-unknown-properties: false

server:
  port: 8082
  error:
    include-message: always

app:
  security:
    # Read from the environment. No default: the app must not start with a
    # signing key someone could read in a repository. See .env.example.
    jwt-secret: ${JWT_SECRET}
    issuer: vedryxtech-voice-agent
    access-token-ttl: 12h

    bootstrap:
      # Creates the organization, its admin and the API key on first start.
      # Re-running is safe: nothing already in the database is overwritten.
      enabled: true

      organization-name: Vedryx Tech
      organization-slug: vedryx-tech
      timezone: Asia/Kolkata

      admin-email: ${BOOTSTRAP_ADMIN_EMAIL:admin@vedryxtech.com}
      admin-password: ${BOOTSTRAP_ADMIN_PASSWORD}
      admin-name: Vedryx Admin

      # The key the AI voice agent sends as the X-API-Key header.
      # Rotate with POST /api/v1/api-keys/current.
      api-key: ${BOOTSTRAP_API_KEY}

      # Would load sample leads from seed/leads.json — that file was never
      # committed, so this does nothing today. Kept false so that adding the
      # file later cannot feed test rows to a live dialler.
      seed-leads: false

  dialer:
    # Background sweep that returns calls abandoned mid-dial to the queue.
    # On from Phase 3: an automatic dialler means leads get stranded in "dialing"
    # when a worker dies, and only this sweep frees them. It still never places a
    # call - the dialler pulls work from POST /api/v1/call-queue/claims.
    scheduler-enabled: true
    maintenance-interval-ms: 60000
    maintenance-initial-delay-ms: 30000
    # How many leads one /call-queue/claims request may hand out.
    batch-size: 25
    # A call still marked "dialing" after this long is treated as abandoned.
    stale-dial-minutes: 15

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true
    doc-expansion: none
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.vedryxtech.voiceagent: DEBUG
