# ---------------------------------------------------------------------------
#  AI Voice Agent - Dashboard API
#
#  Ready to run locally as-is:
#      mvn spring-boot:run
#
#  Then open  http://localhost:8082/docs
#
#  Runtime credentials are defined in this file for local startup.
#
#  Every value below is a real, working local value. Change them before this
#  runs anywhere other than a laptop.
#
#  Single-tenant since 2026-09: there is no organization concept any more.
#  The bootstrap creates the admin user and seeds the API key onto the
#  app_settings singleton.
# ---------------------------------------------------------------------------

spring:
  application:
    name: ai-voice-agent-dashboard

  data:
    mongodb:
      # Atlas MongoDB connection for the highRise_voice database.
      uri: mongodb+srv://signup_db_user:8koQ37zT4rkclnHU@highrise.3mnzjys.mongodb.net/highRise_voice?retryWrites=true&w=majority&appName=highRise
      auto-index-creation: true

    web:
      pageable:
        default-page-size: 20
        max-page-size: 200

  jackson:
    # camelCase on the wire, matching the Java field names.
    serialization:
      write-dates-as-timestamps: false
      indent-output: true
    deserialization:
      fail-on-unknown-properties: false

server:
  # Northflank (and every other PaaS) assigns the port at runtime. 8082 stays the
  # local default, so nothing changes when running from a laptop.
  port: ${PORT:8082}
  error:
    include-message: always

app:
  security:
    # Local HS256 secret. Must remain at least 32 characters long.
    jwt-secret: KBvFNTp0rKuHqtEt39YZFHsKD9xDPEIflx3ujGH6SsazJLAPOGVT2q8g
    issuer: vedryxtech-voice-agent
    # Short-lived access tokens; refresh handles longer sessions via /api/v1/auth/refresh.
    access-token-ttl: 15m

    bootstrap:
      # Creates the admin user, the app_settings singleton and the API key on first start.
      # Re-running is safe: nothing already in the database is overwritten.
      enabled: true

      # Timezone for the calling window and dashboard day buckets, applied only when the
      # app_settings singleton is being created for the first time.
      timezone: Asia/Kolkata

      admin-email: admin@vedryxtech.com
      admin-password: highRise-vedryxTech1!
      admin-name: Vedryx Admin

      # The key the AI voice agent sends as the X-API-Key header.
      # Rotate with POST /api/v1/api-keys/current.
      api-key: vdx_bed0f54ab00fb4f617883360092c9bb78b2e0992

      # Would load sample leads from seed/leads.json — that file was never
      # committed, so this does nothing today. Kept false so that adding the
      # file later cannot feed test rows to a live dialler.
      seed-leads: false

  # Verifying that an egress webhook really came from LiveKit. Same key and secret
  # the agent dials with; without them every webhook is refused.
  livekit:
    api-key: ${LIVEKIT_API_KEY:}
    api-secret: ${LIVEKIT_API_SECRET:}

  # Call artifacts: the audio and the transcript, one prefix per call.
  # Off by default — with no bucket the CRM still records calls and transcripts in
  # Mongo, it simply has no archive to point at.
  storage:
    enabled: true
    endpoint: https://18a1780405889a1f6ab9ede96f6d6fd1.r2.cloudflarestorage.com
    region: auto
    bucket: highrise-recordings
    access-key: 09878cb8ca5ac86d5aaeef2460d7268e
    secret-key: 1319f81483db49acbaad323c3bcacff76ebca28a211cf4e8d53a2f2a9920b6a1
    prefix: recordings
    # A presigned URL is a bearer token. Long enough to press play, short enough
    # that one pasted into a chat is dead before it travels.
    link-ttl: 15m

  dialer:
    # Background sweep that returns calls abandoned mid-dial to the queue.
    # On from Phase 3: an automatic dialler means leads get stranded in "dialing"
    # when a worker dies, and only this sweep frees them. It still never places a
    # call - the dialler pulls work from POST /api/v1/call-queue/claims.
    scheduler-enabled: true
    maintenance-interval-ms: 60000
    maintenance-initial-delay-ms: 30000
    # How many leads one /call-queue/claims request may hand out.
    batch-size: 25
    # A call still marked "dialing" after this long is treated as abandoned.
    stale-dial-minutes: 15

springdoc:
  swagger-ui:
    path: /docs
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true
    doc-expansion: none
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.vedryxtech.voiceagent: DEBUG
